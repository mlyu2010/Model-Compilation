version: '3.8'

services:
  model-compilation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-compilation-prod
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
